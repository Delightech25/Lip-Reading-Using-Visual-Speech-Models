<!DOCTYPE html>

<html>
<head>

<title>Login | Lip Reading AI</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

<style>

body{
height:100vh;
background:linear-gradient(135deg,#667eea,#764ba2);
display:flex;
align-items:center;
justify-content:center;
font-family:Segoe UI;
}

.login-card{
width:420px;
border:none;
border-radius:15px;
box-shadow:0 15px 40px rgba(0,0,0,0.2);
}

.brand{
font-weight:600;
font-size:22px;
}

</style>

</head>

<body>

<div class="card login-card p-4">

<div class="text-center mb-3">

<i class="bi bi-camera-video-fill text-primary" style="font-size:40px"></i>

<div class="brand mt-2">Lip Reading AI System</div>

<small class="text-muted">Visual Speech Recognition Platform</small>

</div>

<form action="/login" method="POST">

<label class="form-label">Username</label>

<div class="input-group mb-3">

<span class="input-group-text">
<i class="bi bi-person"></i>
</span>

<input name="username" class="form-control" placeholder="Enter username" required>

</div>

<label class="form-label">Password</label>

<div class="input-group mb-3">

<span class="input-group-text">
<i class="bi bi-lock"></i>
</span>

<input type="password" id="password" name="password" class="form-control" placeholder="Enter password" required>

<button type="button" class="btn btn-outline-secondary" onclick="togglePassword()">
<i class="bi bi-eye"></i>
</button>

</div>

<button class="btn btn-primary w-100 mb-3">
<i class="bi bi-box-arrow-in-right"></i>
 Login
</button>

<div class="text-center">

<small>
Don't have an account?
<a href="/register">Create account</a>
</small>

</div>

</form>

</div>

<script>

function togglePassword(){

var x=document.getElementById("password");

if(x.type==="password"){
x.type="text";
}else{
x.type="password";
}

}

</script>

</body>
</html>
